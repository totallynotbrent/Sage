<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sage — Streaming & Typing Playground</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a19;--surface:#2f2f2c;--surface-raised:#3a3a37;--surface-sunken:#141413;--surface-warm:#404039;--overlay:#383835;--border:#444440;--border-soft:#3a3a37;--fg:#f0efe8;--fg-2:#dbd9d0;--muted:#a8a69e;--meta:#7a7872;--accent:#c4a7e7;--accent-dim:rgba(196,167,231,0.12);--accent-hover:#d0b8f0;--foam:#9ccfd8;--love:#eb6f92;--gold:#f6c177;--pine:#31748f;--rose:#ebbcba;--font-display:'Newsreader',Georgia,serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--r:8px;--ease:cubic-bezier(0.33,1,0.68,1);--dur:1120ms}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;color:var(--fg);background:var(--bg);min-height:100vh}
.page{max-width:1060px;margin:0 auto;padding:var(--space-8) var(--space-5)}
.page h1{font-family:var(--font-display);font-size:32px;font-weight:500;margin-bottom:var(--space-2);letter-spacing:-0.02em}
.page .subtitle{color:var(--muted);font-size:15px;margin-bottom:var(--space-8)}
h2.section-title{font-family:var(--font-display);font-size:24px;font-weight:500;margin-bottom:var(--space-6);padding-bottom:var(--space-3);border-bottom:1px solid var(--border)}

/* ── Grid ──────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-5);margin-bottom:var(--space-8)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card__header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border)}
.card__title{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:0.04em;color:var(--meta)}
.card__badge{font-family:var(--font-mono);font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-dim);color:var(--accent)}
.card__body{flex:1;padding:var(--space-4);min-height:140px;display:flex;align-items:center;justify-content:center}
.card__controls{display:flex;gap:var(--space-2);padding:var(--space-2) var(--space-4) var(--space-3);border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:6px 12px;border-radius:var(--r);font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--overlay);color:var(--fg);cursor:pointer;transition:all 150ms var(--ease);font-family:var(--font-body)}
.btn:hover{background:var(--surface-warm);border-color:var(--border-soft)}
.btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn-replay{background:var(--overlay);color:var(--meta);border:1px solid var(--border)}
.btn-replay:hover{color:var(--fg);background:var(--surface-warm)}
.label{font-family:var(--font-mono);font-size:10px;color:var(--meta);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:var(--space-1)}
.desc{font-size:12px;color:var(--meta);margin-top:var(--space-2)}

/* ═══════════════════════════════════════════════
   STREAMING TEXT ANIMATIONS
   ═══════════════════════════════════════════════ */

/* 1. Typewriter — classic cursor blink */
.s-type{font-size:14px;line-height:1.6;color:var(--fg);position:relative}
.s-type::after{content:'│';animation:blink 0.8s step-end infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}

/* 2. Fade-in word by word */
.s-fade-word span{display:inline;opacity:0;animation:fadeIn 300ms var(--ease) forwards}
@keyframes fadeIn{to{opacity:1}}

/* 3. Slide-up per line */
.s-slide-line .line{overflow:hidden}
.s-slide-line .line span{display:inline-block;transform:translateY(100%);animation:slideUp 400ms var(--ease) forwards}
@keyframes slideUp{to{transform:translateY(0)}}

/* 4. Blur-to-sharp */
.s-blur span{display:inline;filter:blur(6px);opacity:0;animation:deblur 500ms var(--ease) forwards}
@keyframes deblur{to{filter:blur(0);opacity:1}}

/* 5. Color reveal */
.s-color span{display:inline;opacity:0;color:var(--accent);animation:colorReveal 400ms var(--ease) forwards}
@keyframes colorReveal{0%{opacity:0;color:var(--accent)}60%{color:var(--accent)}100%{opacity:1;color:var(--fg)}}

/* 6. Typewriter with highlight */
.s-highlight{font-size:14px;line-height:1.6;color:var(--fg);position:relative}
.s-highlight::after{content:'│';animation:blink 0.8s step-end infinite;color:var(--gold)}
.s-highlight .hl{background:var(--accent-dim);border-radius:2px;padding:0 2px;transition:background 800ms var(--ease)}

/* 7. Underline sweep */
.s-underline span{display:inline;border-bottom:2px solid var(--accent);padding-bottom:1px;opacity:0;animation:underlineIn 400ms var(--ease) forwards}
@keyframes underlineIn{to{opacity:1}}

/* 8. Scale-in */
.s-scale span{display:inline-block;transform:scale(0.5);opacity:0;animation:scaleIn 350ms var(--ease) forwards}
@keyframes scaleIn{to{transform:scale(1);opacity:1}}

/* 9. Glow pulse per word */
.s-glow span{display:inline;opacity:0;text-shadow:0 0 12px var(--accent);animation:glowIn 500ms var(--ease) forwards}
@keyframes glowIn{0%{opacity:0;text-shadow:0 0 12px var(--accent)}100%{opacity:1;text-shadow:0 0 0 transparent}}

/* 10. Wave / ripple */
.s-wave span{display:inline-block;transform:translateY(4px);opacity:0;animation:waveIn 400ms var(--ease) forwards}
@keyframes waveIn{to{transform:translateY(0);opacity:1}}

/* ═══════════════════════════════════════════════
   TYPING INDICATORS
   ═══════════════════════════════════════════════ */

/* 1. Bouncing dots */
.t-bounce{display:flex;gap:5px;align-items:center}
.t-bounce .dot{width:7px;height:7px;border-radius:50%;background:var(--meta);animation:tBounce 1.2s ease infinite}
.t-bounce .dot:nth-child(2){animation-delay:.15s}
.t-bounce .dot:nth-child(3){animation-delay:.3s}
@keyframes tBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}

/* 2. Pulsing ring */
.t-ring{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);animation:tRing 1.4s ease infinite;position:relative}
.t-ring::after{content:'';position:absolute;inset:4px;border-radius:50%;border:2px solid var(--accent);opacity:.4;animation:tRing 1.4s ease infinite .3s}
@keyframes tRing{0%{transform:scale(.8);opacity:.3}50%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.3}}

/* 3. Wave bars */
.t-bars{display:flex;gap:3px;align-items:end;height:20px}
.t-bars .bar{width:3px;background:var(--accent);border-radius:2px;animation:tBar 1s ease infinite}
.t-bars .bar:nth-child(2){animation-delay:.1s}
.t-bars .bar:nth-child(3){animation-delay:.2s}
.t-bars .bar:nth-child(4){animation-delay:.3s}
.t-bars .bar:nth-child(5){animation-delay:.4s}
@keyframes tBar{0%,100%{height:4px}50%{height:18px}}

/* 4. Orbiting dots */
.t-orbit{width:28px;height:28px;position:relative;animation:tSpin 1.8s linear infinite}
.t-orbit .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);position:absolute}
.t-orbit .dot:nth-child(1){top:0;left:50%;transform:translateX(-50%)}
.t-orbit .dot:nth-child(2){bottom:0;left:50%;transform:translateX(-50%);opacity:.5}
.t-orbit .dot:nth-child(3){left:0;top:50%;transform:translateY(-50%);opacity:.3}
@keyframes tSpin{to{transform:rotate(360deg)}}

/* 5. Morphing shape */
.t-morph{width:24px;height:24px;background:var(--accent);animation:tMorph 1.6s ease infinite}
@keyframes tMorph{0%,100%{border-radius:50%;transform:rotate(0) scale(1)}25%{border-radius:20%;transform:rotate(90deg) scale(.8)}50%{border-radius:50%;transform:rotate(180deg) scale(1)}75%{border-radius:20%;transform:rotate(270deg) scale(.8)}}

/* 6. Gradient sweep */
.t-gradient{width:80px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:tGradient 1.2s ease infinite}
@keyframes tGradient{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* 7. Binary scroll */
.t-binary{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:2px;overflow:hidden;white-space:nowrap;width:60px;animation:tScroll 2s linear infinite}
@keyframes tScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* 8. Pulse dot */
.t-pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:tPulseDot 1.5s ease infinite}
@keyframes tPulseDot{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(196,167,231,.4)}50%{transform:scale(1.2);box-shadow:0 0 0 12px rgba(196,167,231,0)}}

/* 9. Three-dot typing with label */
.t-labeled{display:flex;align-items:center;gap:var(--space-2)}
.t-labeled .dots{display:flex;gap:4px}
.t-labeled .dot{width:5px;height:5px;border-radius:50%;background:var(--meta);animation:tBounce 1s ease infinite}
.t-labeled .dot:nth-child(2){animation-delay:.12s}
.t-labeled .dot:nth-child(3){animation-delay:.24s}
.t-labeled .text{font-size:12px;color:var(--meta);font-family:var(--font-mono);animation:fadeInOut 2s ease infinite}
@keyframes fadeInOut{0%,100%{opacity:.5}50%{opacity:1}}

/* 10. DNA helix */
.t-helix{display:flex;gap:4px;align-items:center;height:20px}
.t-helix .strand{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:tHelix 1.4s ease infinite}
.t-helix .strand:nth-child(2){animation-delay:.14s}
.t-helix .strand:nth-child(3){animation-delay:.28s}
.t-helix .strand:nth-child(4){animation-delay:.42s}
.t-helix .strand:nth-child(5){animation-delay:.56s}
.t-helix .strand:nth-child(6){animation-delay:.7s}
@keyframes tHelix{0%,100%{transform:translateY(-6px);opacity:.3}50%{transform:translateY(6px);opacity:1}}

/* ── Shared stream text styling ───────────── */
.stream-text{font-size:14px;line-height:1.7;color:var(--fg);max-width:100%;word-wrap:break-word}
.stream-text strong{font-weight:600;color:var(--fg)}
</style>
</head>
<body>
<div class="page">
  <h1>Streaming & Typing Playground</h1>
  <p class="subtitle">10 ways to animate streaming text + 10 typing indicators. Click Replay to see each one again.</p>

  <!-- ═══════ STREAMING TEXT ═══════ -->
  <h2 class="section-title">Streaming Text Animations</h2>
  <div class="grid" id="stream-grid"></div>

  <!-- ═══════ TYPING INDICATORS ═══════ -->
  <h2 class="section-title">Typing Indicators</h2>
  <div class="grid" id="typing-grid"></div>

</div>

<script>
const sampleText="BFS explores nodes in layers — each frontier holds nodes at distance k from the source. The first time we discover a node, we've guaranteed the shortest path.";

/* ═══════════════════════════════════════════════
   STREAMING ANIMATIONS
   ═══════════════════════════════════════════════ */
const streams=[
  {id:'s1',name:'Typewriter',desc:'Classic character-by-character with blinking cursor.',render(el){
    el.innerHTML='<div class="s-type"></div>';
    const t=el.querySelector('.s-type');
    let i=0;
    const iv=setInterval(()=>{if(i>=sampleText.length){clearInterval(iv);return}t.textContent+=sampleText[i];i++},35);
    return()=>clearInterval(iv);
  }},
  {id:'s2',name:'Fade-in Words',desc:'Each word fades in independently — smooth and readable.',render(el){
    const words=sampleText.split(' ');
    el.innerHTML='<div class="stream-text s-fade-word">'+words.map((w,i)=>`<span style="animation-delay:${i*60}ms">${w} </span>`).join('')+'</div>';
  }},
  {id:'s3',name:'Slide-up Lines',desc:'Text slides up line-by-line from below — editorial feel.',render(el){
    const lines=wrapLines(sampleText,40);
    el.innerHTML='<div class="stream-text s-slide-line">'+lines.map((l,i)=>`<div class="line"><span style="animation-delay:${i*200}ms">${l}</span></div>`).join('')+'</div>';
  }},
  {id:'s4',name:'Blur-to-Sharp',desc:'Words start blurred and sharpen into focus — dreamy reveal.',render(el){
    const words=sampleText.split(' ');
    el.innerHTML='<div class="stream-text s-blur">'+words.map((w,i)=>`<span style="animation-delay:${i*80}ms">${w} </span>`).join('')+'</div>';
  }},
  {id:'s5',name:'Color Reveal',desc:'Words flash accent color then settle to normal — energetic.',render(el){
    const words=sampleText.split(' ');
    el.innerHTML='<div class="stream-text s-color">'+words.map((w,i)=>`<span style="animation-delay:${i*70}ms">${w} </span>`).join('')+'</div>';
  }},
  {id:'s6',name:'Typewriter + Highlight',desc:'Cursor types text, then key terms get a highlight wash.',render(el){
    el.innerHTML='<div class="s-highlight"></div>';
    const t=el.querySelector('.s-highlight');
    let i=0;
    const iv=setInterval(()=>{if(i>=sampleText.length){clearInterval(iv);highlightTerms(t);return}t.firstChild.textContent+=sampleText[i];i++},30);
    return()=>clearInterval(iv);
  }},
  {id:'s7',name:'Underline Sweep',desc:'Each word appears with an accent underline that fades — scholarly.',render(el){
    const words=sampleText.split(' ');
    el.innerHTML='<div class="stream-text s-underline">'+words.map((w,i)=>`<span style="animation-delay:${i*65}ms">${w} </span>`).join('')+'</div>';
  }},
  {id:'s8',name:'Scale-in',desc:'Words pop in from small to full size — playful bounce.',render(el){
    const words=sampleText.split(' ');
    el.innerHTML='<div class="stream-text s-scale">'+words.map((w,i)=>`<span style="animation-delay:${i*55}ms">${w} </span>`).join('')+'</div>';
  }},
  {id:'s9',name:'Glow Pulse',desc:'Each word glows purple then fades — ethereal and distinctive.',render(el){
    const words=sampleText.split(' ');
    el.innerHTML='<div class="stream-text s-glow">'+words.map((w,i)=>`<span style="animation-delay:${i*75}ms">${w} </span>`).join('')+'</div>';
  }},
  {id:'s10',name:'Wave Ripple',desc:'Words drift up in a wave pattern — organic and calming.',render(el){
    const words=sampleText.split(' ');
    el.innerHTML='<div class="stream-text s-wave">'+words.map((w,i)=>`<span style="animation-delay:${i*50}ms">${w} </span>`).join('')+'</div>';
  }},
];

/* ═══════════════════════════════════════════════
   TYPING INDICATORS
   ═══════════════════════════════════════════════ */
const typings=[
  {id:'t1',name:'Bouncing Dots',html:'<div class="t-bounce"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'},
  {id:'t2',name:'Pulsing Ring',html:'<div class="t-ring"></div>'},
  {id:'t3',name:'Wave Bars',html:'<div class="t-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>'},
  {id:'t4',name:'Orbiting Dots',html:'<div class="t-orbit"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'},
  {id:'t5',name:'Morphing Shape',html:'<div class="t-morph"></div>'},
  {id:'t6',name:'Gradient Sweep',html:'<div class="t-gradient"></div>'},
  {id:'t7',name:'Binary Scroll',html:'<div class="t-binary">01001010 01001010 </div>'},
  {id:'t8',name:'Pulse Dot',html:'<div class="t-pulse-dot"></div>'},
  {id:'t9',name:'Labeled Dots',html:'<div class="t-labeled"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span class="text">thinking</span></div>'},
  {id:'t10',name:'DNA Helix',html:'<div class="t-helix"><div class="strand"></div><div class="strand"></div><div class="strand"></div><div class="strand"></div><div class="strand"></div><div class="strand"></div></div>'},
];

/* ═══════════════════════════════════════════════
   BUILD CARDS
   ═══════════════════════════════════════════════ */
const streamGrid=document.getElementById('stream-grid');
const typingGrid=document.getElementById('typing-grid');
let cleaners=[];

streams.forEach((s,i)=>{
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="card__header"><span class="card__title">${s.name}</span><span class="card__badge">${i+1}</span></div>
    <div class="card__body" id="body-${s.id}"></div>
    <div class="card__controls"><button class="btn btn-replay" data-replay="${s.id}">↻ Replay</button></div>
    <div class="desc" style="padding:0 var(--space-4) var(--space-3)">${s.desc}</div>`;
  streamGrid.appendChild(card);
  const body=card.querySelector('.card__body');
  const cleanup=s.render(body);
  if(cleanup) cleaners.push(cleanup);
  card.querySelector('[data-replay]').addEventListener('click',()=>{
    if(cleanup) cleanup();
    body.innerHTML='';
    s.render(body);
  });
});

typings.forEach((t,i)=>{
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="card__header"><span class="card__title">${t.name}</span><span class="card__badge">${i+1}</span></div>
    <div class="card__body">${t.html}</div>
    <div class="card__controls"><button class="btn btn-replay" data-replay="${t.id}">↻ Replay</button></div>`;
  typingGrid.appendChild(card);
  card.querySelector('[data-replay]').addEventListener('click',()=>{
    const body=card.querySelector('.card__body');
    body.innerHTML=t.html;
  });
});

/* ═══════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════ */
function wrapLines(text,maxLen){
  const words=text.split(' ');const lines=[];let line='';
  words.forEach(w=>{if((line+' '+w).trim().length>maxLen){lines.push(line.trim());line=w}else{line+=(line?' ':'')+w}});
  if(line.trim())lines.push(line.trim());
  return lines;
}

function highlightTerms(el){
  const terms=['layers','shortest','distance'];
  let html=el.firstChild.textContent;
  terms.forEach(t=>{
    const re=new RegExp(`\\b(${t})\\b`,'gi');
    html=html.replace(re,`<span class="hl">$1</span>`);
  });
  el.innerHTML=html;
}
</script>
</body>
</html>
