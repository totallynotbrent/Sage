            - generic [ref=f2e244]:
              - paragraph [ref=f2e245]: You got the first one right! The base case is indeed the "stop sign" that prevents the function from running forever.
              - paragraph [ref=f2e246]: "For the second one, it looks like you're unsure. Here is the breakdown: whenever a function is called, the computer creates a \"stack frame\" (a little block of memory) to store that specific call's variables. In recursion, because the function calls itself before the first call ever finishes, these frames pile up on top of each other—like a stack of plates."
              - paragraph [ref=f2e247]: Does that make sense?
