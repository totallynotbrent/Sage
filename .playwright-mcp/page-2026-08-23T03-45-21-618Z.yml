            - generic [ref=f2e276]: Yes, that is tail recursion - the recursive call is the final action with no remaining work after it returns. I'm ready for the full lesson plan now.
          - generic [ref=f2e283]:
            - generic [ref=f2e284]: Sage
            - generic [ref=f2e285]:
              - paragraph [ref=f2e286]: Since you've already touched on tail recursion, we'll use this plan to solidify the foundations first and then circle back to the advanced optimizations. As with the dolls, we'll start with the biggest picture and work our way in.
              - paragraph [ref=f2e287]:
                - strong [ref=f2e288]: The Anatomy of Recursion
              - paragraph [ref=f2e289]: "At its simplest, every recursive function must have two essential components to avoid running forever:"
              - list [ref=f2e290]:
                - listitem [ref=f2e291]:
                  - strong [ref=f2e292]: "The Base Case:"
                  - text: This is the "stopping condition." It is a simple case that can be solved immediately without any further recursion.
                - listitem [ref=f2e293]:
                  - strong [ref=f2e294]: "The Recursive Step:"
                  - text: This is where the function calls itself, but with a
                  - strong [ref=f2e295]: modified input
                  - text: that moves the state closer to the base case.
              - paragraph [ref=f2e296]: If the recursive step doesn't move the input closer to the base case, you end up with infinite recursion (which leads to a stack overflow).
              - paragraph [ref=f2e297]:
                - emphasis [ref=f2e298]: "Synthesis: This structure ensures that the problem is broken down into smaller versions of itself until it reaches a size that is trivial to solve."
              - paragraph [ref=f2e299]: "To make sure we're on the same page: If a recursive function is missing its base case, will it eventually stop? (Yes/No)"
          - generic [ref=f2e300]:
            - generic [ref=f2e301]: You
            - generic [ref=f2e302]: No - without a base case the recursion would never stop and would overflow the stack.
          - generic [ref=f2e310]:
            - generic [ref=f2e311]: Sage
            - generic [ref=f2e312]:
              - paragraph [ref=f2e313]: You're exactly right. Without that base case, the function would keep calling itself indefinitely until the computer runs out of memory for those calls.
              - paragraph [ref=f2e314]:
                - text: Since you mentioned it, let's look at how that actually happens. When a function is called, the computer doesn't just jump to the new code; it creates a
                - strong [ref=f2e315]: Stack Frame
                - text: . This is a small block of memory that stores the function's local variables and the "return address" (where the computer should go back to once the function finishes).
              - paragraph [ref=f2e316]:
                - text: As with the dolls, each recursive call pushes a new frame onto the top of the
                - strong [ref=f2e317]: Call Stack
                - text: . These frames stay there, waiting, until the base case is finally hit. Only then can the computer start "popping" them off the stack one by one to resolve the final answer.
