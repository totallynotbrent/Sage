            - generic [ref=f2e266]: Sage
            - generic [ref=f2e267]:
              - paragraph [ref=f2e268]: Since we're still on the probe phase, let's clear up that last point before we map out our full plan.
              - paragraph [ref=f2e269]:
                - text: You mentioned the call stack grows with each call, which is generally true. However, there is a special case called
                - strong [ref=f2e270]: Tail Recursion
                - text: . This happens when the recursive call is the very last thing the function does—meaning there is no more work to do after the call returns.
              - paragraph [ref=f2e271]: Because there's no remaining work, some smart compilers can perform "Tail Call Optimization" (TCO). Instead of adding a new frame to the stack, the compiler simply replaces the current frame with the new one. This prevents the stack from growing and avoids a stack overflow.
              - paragraph [ref=f2e272]: "(Note: This explanation is based on general computer science knowledge as no specific document was provided for this detail.)"
              - paragraph [ref=f2e273]: "To make sure this clicks: If a function makes a recursive call and then adds 1 to the result of that call, is that considered tail recursion?"
          - generic [ref=f2e274]:
