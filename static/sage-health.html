<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sage, health</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- shared design system -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sage.css">
  <style>
.content_centered{max-width:600px;width:100%;margin:0 auto;padding:var(--space-8) var(--space-5);overflow-y:auto}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:4px 10px;border-radius:var(--r);font-size:12px;font-weight:500;transition:background 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease)}
.btn svg{width:13px;height:13px}
.health_card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--space-5);margin-bottom:var(--space-4)}
.health_overall{display:flex;align-items:center;gap:var(--space-4);padding-bottom:var(--space-5);margin-bottom:var(--space-4);border-bottom:1px solid var(--border)}
.health_icon{width:40px;height:40px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.health_icon.ok{background:rgba(156,207,216,0.12);color:var(--foam)}
.health_icon.warn{background:rgba(246,193,119,0.12);color:var(--gold)}
.health_icon.error{background:rgba(235,111,146,0.12);color:var(--love)}
.health_overall_text{flex:1}
.health_overall_title{font-weight:600;font-size:15px;margin-bottom:2px}
.status_badge{font-family:var(--font-mono);font-size:11px;font-weight:500;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--overlay)}
.status_badge.ok{color:var(--foam)}
.status_badge.warn{color:var(--gold)}
.status_badge.error{color:var(--love)}
.health_row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--border)}
.health_row:last-child{border-bottom:none}
.health_label{display:flex;align-items:center;gap:var(--space-2);color:var(--muted);font-size:13px}
.health_dot{width:6px;height:6px;border-radius:50%;background:var(--meta);flex-shrink:0}
.health_dot.ok{background:var(--foam)}
.health_dot.warn{background:var(--gold)}
.health_dot.error{background:var(--love)}
.health_value{font-family:var(--font-mono);font-size:13px;font-weight:500}
.health_value.ok{color:var(--foam)}
.health_value.love{color:var(--love)}
.health_value.gold{color:var(--gold)}
.health_caption{font-family:var(--font-mono);font-size:11px;color:var(--meta)}
.dependency_error{font-family:var(--font-mono);font-size:13px;color:var(--love);line-height:1.6;padding:var(--space-2) 0;border-bottom:1px solid var(--border);word-break:break-word}
.dependency_error:last-child{border-bottom:none}
  </style>
</head>
<body data-sage-animate>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <a href="index.html" class="logo">S<span>a</span>ge</a>
  </div>
  <div class="layout">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<aside class="sidebar" id="sidebar">
  
      <div class="sidebar__section" id="plan-section">
        <button class="sidebar__header" aria-expanded="false"><span>Plan</span><svg class="sidebar__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M4 5.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <div class="sidebar__list" id="plan-nodes"></div>
      </div>
<div class="sidebar__section open">
    <button class="sidebar__header"><span>Navigate</span><svg class="sidebar__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 5.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    <div class="sidebar__list">
      <a href="index.html" class="sidebar__item">Home</a>
      <a href="sage-workspace.html" class="sidebar__item">Workspace</a>
      <a href="sage-library.html" class="sidebar__item">Library</a>
      <a href="sage-sessions.html" class="sidebar__item">Sessions</a>
      <a href="sage-settings.html" class="sidebar__item">Settings</a>
      <a href="sage-health.html" class="sidebar__item active">Health</a>
    </div>
  </div>
      <div class="sidebar__section open">
        <button class="sidebar__header" aria-expanded="true" aria-controls="files-list"><span>Files</span><svg class="sidebar__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M4 5.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <div class="sidebar__list" id="files-list"></div>
      </div>
  <div class="sidebar__section open">
    <button class="sidebar__header"><span>Sessions</span><svg class="sidebar__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 5.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    <div class="sidebar__list" id="sessions-list"></div>
  </div>
</aside>
<main class="main">
<div class="content_centered">
<div class="page_header">
<h1 class="page_title">System Health</h1>
<button class="btn btn_primary" id="refresh-btn"><svg viewBox="0 0 14 14" fill="none"><path d="M2 7a5 5 0 019.33-2.5M12 7a5 5 0 01-9.33 2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M11 2v3h-3M3 12v-3h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh</button>
</div>
<div id="health-content" data-sage-stagger="60"></div>
</div>
</main>
</div>
</div>
<script src="sage.js"></script>
<script>
const sidebar=document.getElementById('sidebar');const backdrop=document.getElementById('sidebar-backdrop');
function toggleSidebar(){try{
  const mq = window.matchMedia('(max-width:1023px)');
  let open;
  if (mq.matches) {
    open = sidebar?.classList.toggle('collapsed') === false;
    backdrop?.classList.toggle('open', open);
    if (!open) backdrop?.classList.remove('open');
  } else {
    // Desktop: slide away without the dark overlay
    open = sidebar?.classList.toggle('collapsed') === false;
    backdrop?.classList.remove('open');
  }
  const btn=document.getElementById('menu-btn'); if(btn) btn.setAttribute('aria-expanded', String(open));
}catch(e){}}
function close_sidebar(){try{ sidebar?.classList.add('collapsed');backdrop?.classList.remove('open'); const btn=document.getElementById('menu-btn'); if(btn) btn.setAttribute('aria-expanded','false')}catch(e){}}
const menu_btn=document.getElementById('menu-btn');
menu_btn?.addEventListener('click',toggleSidebar);
backdrop?.addEventListener('click',close_sidebar);
document.querySelectorAll('.sidebar__header').forEach(function(b){b.addEventListener('click',function(){const sec=b.closest('.sidebar__section'); if(!sec) return; const open=sec.classList.toggle('open'); b.setAttribute('aria-expanded', String(open))})});
if(window.innerWidth<1024)sidebar?.classList.add('collapsed');

const refresh_btn=document.getElementById('refresh-btn');
refresh_btn?.addEventListener('click', async()=>{
  if(refresh_btn){ refresh_btn.disabled=true; const orig=refresh_btn.innerHTML; refresh_btn.textContent='Refreshing…'; await loadHealth(); refresh_btn.disabled=false; refresh_btn.innerHTML=orig; }
});
document.getElementById('refresh-btn')?.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); loadHealth(); }});

async function loadHealth(){
  const el=document.getElementById('health-content');
  el.innerHTML='<div class="health_card"><div class="health_overall"><div class="health_icon warn">…</div><div class="health_overall_text"><div class="health_overall_title">Checking system health</div></div></div></div>';
  try{
    const r=await fetch('/api/health');
    const d=await r.json();
    const s=d.status==='ok'?'ok':d.status==='degraded'?'warn':'error';
    const icon=s==='ok'?'\u2713':s==='warn'?'\u26a0':'\u2717';
    const model_dot=d.model_configured?'ok':'error';
    const endpoint_state=d.endpoint_reachable===true?'ok':d.endpoint_reachable===false?'error':'warn';
    const endpoint_text=d.endpoint_reachable===true?'Yes':d.endpoint_reachable===false?'No':'Unknown';
    el.innerHTML=`
      <div class="health_card">
        <div class="health_overall">
          <div class="health_icon ${s}">${icon}</div>
          <div class="health_overall_text"><div class="health_overall_title">Overall Status</div></div>
          <span class="status_badge ${s}">${esc(d.status)}</span>
        </div>
        <div class="health_row">
          <span class="health_label"><span class="health_dot ${model_dot}"></span>Model Configured</span>
          <span class="health_value ${model_dot}">${d.model_configured?'Yes':'No'}</span>
        </div>
        <div class="health_row">
          <span class="health_label"><span class="health_dot ${endpoint_state}"></span>Endpoint Reachable</span>
          <span class="health_value ${endpoint_state}">${endpoint_text}</span>
        </div>
        <div class="health_row">
          <span class="health_label">Checked At</span>
          <span class="health_caption">${new Date(d.checked_at).toLocaleString()}</span>
        </div>
      </div>
      ${d.dependency_errors&&d.dependency_errors.length?`
      <div class="health_card">
        <div class="health_overall" style="border-bottom:none;padding-bottom:var(--space-2);margin-bottom:var(--space-2)">
          <div class="health_icon error">\u26a0</div>
          <div class="health_overall_text"><div class="health_overall_title">Dependency Errors</div></div>
        </div>
        ${d.dependency_errors.map(e=>`<div class="dependency_error">${esc(e)}</div>`).join('')}
      </div>`:''}
    `;
  }catch(e){
    el.innerHTML=`<div class="health_card"><div class="health_overall"><div class="health_icon error">\u2717</div><div class="health_overall_text"><div class="health_overall_title">Connection Failed</div></div><span class="status_badge error">offline</span></div><div class="health_row"><span class="health_value love">Could not reach the Sage server. Is it running?</span></div></div>`;
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')close_sidebar()});
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
document.getElementById('refresh-btn')?.setAttribute('aria-label','Refresh health check');
loadHealth();
</script>
</body>
</html>
