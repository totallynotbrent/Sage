<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sage · unlock</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --base:#191724; --surface:#1f1d2e; --muted:#6e6a86; --subtle:#908caa; --text:#e0def4;
    --foam:#9ccfd8; --gold:#f6c177;
    --font:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  html,body{height:100%}
  body{font-family:var(--font);color:var(--text);background:var(--base);height:100%;overflow:hidden;position:relative}
  #login-bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;transition:none}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 120% at 50% 42%, rgba(24,23,36,0) 34%, rgba(15,14,23,.78) 100%)}
  .stage{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px}
  .ask{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 12px rgba(0,0,0,.5)}
  .wordmark{font-size:21px;font-weight:640;letter-spacing:.3em;text-transform:uppercase;color:var(--text);text-shadow:0 2px 18px rgba(0,0,0,.55)}
  form{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--subtle);padding-bottom:10px;width:min(320px,80vw);opacity:0;animation:formIn .6s .3s cubic-bezier(.33,1,.68,1) forwards}
  @keyframes formIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  input{flex:1;background:none;border:none;outline:none;color:var(--text);font:inherit;font-size:17px;letter-spacing:.08em}
  input::placeholder{color:var(--muted)}
  form:focus-within{border-color:var(--foam)}
  .arrow{width:38px;height:38px;border:none;border-radius:50%;background:none;color:var(--foam);cursor:pointer;display:grid;place-items:center;font-size:18px;transition:background .15s,transform .12s}
  .arrow:hover{background:rgba(31,29,46,.6)}
  .arrow:active{transform:scale(.94)}
  .arrow[disabled]{opacity:.5;cursor:progress}
  .status{font-size:13px;color:var(--gold);height:18px;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  .status.error{color:var(--love, #eb6f92)}
</style>
</head>
<body>
  <canvas id="login-bg"></canvas>
  <div class="vignette"></div>
  <div class="stage">
    <div class="ask">unlock sage</div>
    <div class="wordmark">Sage</div>
    <form id="f">
      <input id="pw" type="password" placeholder="password" autocomplete="current-password" autofocus>
      <button class="arrow" id="go" type="submit" aria-label="Unlock">→</button>
    </form>
    <div class="status" id="status"></div>
  </div>
  <script src="/auth/RgbQuant.js"></script>
  <script src="/auth/dither.js"></script>
  <script>
  (function () {
    const bg = document.getElementById('login-bg');
    if (!bg || !window.dither) return;
    const D = window.dither;

    const target = 50;
    const min_count = 3;
    const final_opacity = 0.62;
    const hold = 40;
    const rf_base = 0.04;
    const dither_base = { cell: 2, mode: 'bayer', kernel: 'burkes', serpentine: false, matrix: 16 };
    const noise = { kind: 'grain', amount: 0.1, cell: 2, blend: 'subtract' };

    function ease_out_circ(t) { return Math.sqrt(1 - Math.pow(t - 1, 2)); }
    function ease_out_quart(t) { return 1 - Math.pow(1 - t, 4); }
    function ease_in_expo(t) { return t === 0 ? 0 : Math.pow(2, 10 * t - 10); }

    function full_res() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
      const sc = Math.min(1, 1920 / Math.max(w, h));
      return { w: Math.round(w * sc), h: Math.round(h * sc) };
    }
    function resolve_pal(pal, k, target) {
      const n = pal.length;
      if (k <= 1) return [pal[Math.round((n - 1) / 2)]];
      if (k >= target) return pal.slice();
      const out = [];
      for (let j = 0; j < k; j++) out.push(pal[Math.round((n - 1) * j / (k - 1))]);
      return out;
    }
    function ensure_pal(pal, target) {
      const n = pal.length;
      if (n >= target) return pal.slice(0, target);
      const out = [];
      for (let j = 0; j < target; j++) {
        const f = (n - 1) * j / (target - 1), a = Math.floor(f), g = f - a, b = Math.min(n - 1, a + 1);
        out.push([Math.round(pal[a][0] + (pal[b][0] - pal[a][0]) * g), Math.round(pal[a][1] + (pal[b][1] - pal[a][1]) * g), Math.round(pal[a][2] + (pal[b][2] - pal[a][2]) * g)]);
      }
      return out;
    }
    function cover_rect(iw, ih, s) {
      const dst_ar = s.w / s.h;
      let sw = iw, sh = iw / dst_ar, sx = 0, sy = (ih - sh) / 2;
      if (sh > ih) { sh = ih; sw = ih * dst_ar; sx = (iw - sw) * 0.25; sy = 0; }
      return { sw: Math.round(sw), sh: Math.round(sh), sx: Math.round(sx), sy: Math.round(sy) };
    }
    function build_crop(img, iw, ih, s) {
      const r = cover_rect(iw, ih, s);
      const crop = document.createElement('canvas');
      crop.width = Math.max(8, r.sw); crop.height = Math.max(8, r.sh);
      crop.getContext('2d').drawImage(img, r.sx, r.sy, r.sw, r.sh, 0, 0, crop.width, crop.height);
      return crop;
    }

    const s = full_res();
    let crop, pal, k_max, steps;

    function draw(k, rf, op) {
      bg.width = Math.max(64, Math.round(s.w * rf));
      bg.height = Math.max(64, Math.round(s.h * rf));
      return D.dither_into(bg, crop, Object.assign({}, dither_base, { palette_c: resolve_pal(pal, k, target) }))
        .then(function () { bg.style.opacity = String(op.toFixed(3)); });
    }
    function render_initial() {
      return draw(min_count, rf_base, 0.06);
    }
    function run_bloom() {
      let i = 0;
      function frame() {
        const t = (i + 1) / steps;
        const k = Math.max(min_count, Math.min(k_max, Math.round(min_count + (k_max - min_count) * ease_in_expo(t))));
        const rf = rf_base + (1 - rf_base) * ease_out_quart(t);
        const op = 0.06 + (final_opacity - 0.06) * ease_out_circ(t);
        return draw(k, rf, op).then(function () {
          i++;
          if (i >= steps) { setTimeout(set_final, hold); return; }
          setTimeout(frame, hold);
        });
      }
      return frame();
    }
    function set_final() {
      bg.width = s.w; bg.height = s.h;
      return D.dither_into(bg, crop, Object.assign({}, dither_base, { palette_c: pal })).then(function () {
        D.apply_noise(bg, noise);
        bg.style.opacity = String(final_opacity);
      });
    }

    D.load_image('/auth/wallpaper.jpg').then(function (img) {
      const iw = img.width, ih = img.height;
      crop = build_crop(img, iw, ih, s);
      pal = ensure_pal(D.build_palette(img, { colors: target, palette: 'extract', saturation: 0.6 }), target);
      k_max = Math.max(min_count, pal.length);
      steps = k_max - min_count + 1;
      return render_initial();
    });

    const form = document.getElementById('f');
    const pw = document.getElementById('pw');
    const status = document.getElementById('status');
    const go = document.getElementById('go');
    let busy = false;

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy) return;
      const value = pw.value.trim();
      if (!value) { setStatus('enter password above', true); return; }
      busy = true;
      go.setAttribute('disabled', '');
      go.textContent = '…';
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: value })
      }).then(function (r) {
        if (!r.ok) throw new Error('wrong password');
        pw.value = '';
        setStatus('unlocking…', false);
        return run_bloom();
      }).then(function () {
        setTimeout(function () { location.href = '/'; }, hold + 80);
      }).catch(function () {
        setStatus('wrong password', true);
        busy = false;
        go.removeAttribute('disabled');
        go.textContent = '→';
        pw.focus();
      });
    });

    function setStatus(text, err) {
      status.textContent = text;
      status.classList.toggle('error', !!err);
    }
  })();
  </script>
</body>
</html>
