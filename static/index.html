<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},startup:{pageReady:()=>MathJax.startup.defaultPageReady()}}</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
:root{--bg:#1a1a19;--surface:#2f2f2c;--surface-raised:#3a3a37;--surface-sunken:#141413;--surface-warm:#404039;--overlay:#383835;--border:#444440;--border-soft:#3a3a37;--fg:#f0efe8;--fg-2:#dbd9d0;--muted:#a8a69e;--meta:#7a7872;--accent:#c4a7e7;--accent-dim:rgba(196,167,231,0.12);--accent-hover:#d0b8f0;--foam:#9ccfd8;--love:#eb6f92;--gold:#f6c177;--pine:#31748f;--rose:#ebbcba;--font-display:'Newsreader',Georgia,serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--r:8px;--ease:cubic-bezier(0.33,1,0.68,1);--dur:180ms;--dur-slow:500ms;--sidebar-w:260px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea{font:inherit;color:inherit}
:where(a,button,[role="radio"],[role="option"],[tabindex],summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:100svh}
.topbar{display:flex;align-items:center;gap:var(--space-3);height:48px;padding:0 var(--space-4);background:transparent;border-bottom:none;flex-shrink:0;z-index:20}
.layout{display:flex;flex:1;min-height:0;overflow:hidden}
.logo{font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--fg);letter-spacing:-0.02em;text-decoration:none}
.logo span{color:var(--muted)}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r);color:var(--muted);border:none;background:none;cursor:pointer;transition:all var(--dur) var(--ease)}
.icon-btn:hover{background:var(--overlay);color:var(--fg)}

.sidebar{width:var(--sidebar-w);background:var(--bg);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;transition:transform var(--dur-slow) var(--ease),opacity var(--dur-slow) var(--ease)}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:29}
.sidebar-backdrop.open{display:block}
.sidebar.collapsed{position:absolute;left:0;top:0;bottom:0;width:0;max-width:0;min-width:0;transform:translateX(-100%);opacity:0;visibility:hidden;border-right:0;pointer-events:none;z-index:30}
.sidebar:not(.collapsed){transform:translateX(0)}
.sidebar__section{border-bottom:1px solid var(--border)}
.sidebar__header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:var(--space-3) var(--space-4);font-size:12px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--meta);border:none;background:none;cursor:pointer;font-family:var(--font-body);transition:color var(--dur) var(--ease)}
.sidebar__header:hover{color:var(--muted)}
.sidebar__chevron{transition:transform var(--dur) var(--ease)}
.sidebar__section.open .sidebar__chevron{transform:rotate(180deg)}
.sidebar__list{display:none;padding:0 var(--space-2) var(--space-2)}
.sidebar__section.open .sidebar__list{display:block}
.sidebar__item{display:flex;align-items:center;gap:var(--space-2);padding:7px var(--space-3);border-radius:var(--r);font-size:13px;color:var(--muted);cursor:pointer;transition:all var(--dur) var(--ease)}
.sidebar__item:hover{background:var(--overlay);color:var(--fg)}
.sidebar__item.active{background:var(--overlay);color:var(--fg)}
.sidebar__item-badge{font-size:10px;font-weight:500;letter-spacing:0.03em;padding:2px 7px;border-radius:var(--r);background:var(--overlay);color:var(--meta);flex-shrink:0}
.sidebar__item-badge[data-phase="teach"]{color:var(--accent)}
.sidebar__item-badge[data-phase="plan"]{color:var(--gold)}
.sidebar__item-badge[data-phase="complete"]{color:var(--foam)}
.sidebar__item-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg)}
.chat{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}
.chat__messages{flex:1;overflow-y:auto;padding:var(--space-6) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.msg{display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;padding:var(--space-4) 0}
.msg--user{align-items:flex-end}
.msg--assistant{align-items:flex-start}
.msg__role{font-size:12px;font-weight:500;color:var(--meta);margin-bottom:6px;padding:0 var(--space-4);letter-spacing:0.01em}
.msg__bubble{padding:var(--space-4) var(--space-5);border-radius:var(--r);line-height:1.7;word-wrap:break-word;overflow-wrap:break-word;max-width:100%}
.msg--user .msg__bubble{background:var(--surface-raised);color:var(--fg)}
.msg--assistant .msg__bubble{background:transparent;color:var(--fg)}
.msg__bubble p{margin:0 0 var(--space-3)}.msg__bubble p:last-child{margin-bottom:0}
.msg__bubble ul,.msg__bubble ol{margin:var(--space-3) 0;padding-left:var(--space-6)}
.msg__bubble li{margin:var(--space-1) 0}
.msg__bubble strong{font-weight:600;color:var(--fg)}.msg__bubble em{color:var(--muted);font-style:italic}
.msg__bubble code{font-family:var(--font-mono);font-size:13px;background:var(--overlay);padding:2px 6px;border-radius:var(--r)}
.msg__bubble pre{background:var(--surface-sunken);border-radius:var(--r);padding:var(--space-4);overflow-x:auto;margin:var(--space-3) 0}
.msg__bubble pre code{background:none;padding:0;font-size:13px;line-height:1.6}
.msg__bubble blockquote{border-left:2px solid var(--accent);padding-left:var(--space-4);color:var(--muted);margin:var(--space-3) 0;font-style:italic}
.msg__bubble h1,.msg__bubble h2,.msg__bubble h3{font-family:var(--font-display);color:var(--fg);margin:var(--space-4) 0 var(--space-2);line-height:1.3}

.cite{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r);background:var(--overlay);color:var(--accent);cursor:pointer;vertical-align:middle;transition:all var(--dur) var(--ease);text-decoration:none}
.cite:hover{background:var(--surface-warm);text-decoration:none}
.cite-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--space-2);max-width:100%}

.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:var(--space-3);text-align:center;padding:var(--space-8)}
.hero h1{font-family:var(--font-display);font-size:28px;font-weight:500;color:var(--fg);line-height:1.2;letter-spacing:-0.02em}
.hero p{font-size:15px;color:var(--muted)}

.input-bar{padding:var(--space-3) var(--space-4) calc(var(--space-8) + env(safe-area-inset-bottom));flex-shrink:0;min-height:0}
@media(max-width:1023px){.input-bar{padding:var(--space-3) var(--space-4) var(--space-5)}}
.composer-toolbar{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;padding:0 var(--space-3) var(--space-2);max-width:760px;margin:0 auto}
.composer-toolbar__btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--meta);background:none;border:none;cursor:pointer;transition:all var(--dur) var(--ease)}
.composer-toolbar__btn:hover{color:var(--fg);background:var(--overlay)}
.composer-toolbar__btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.composer-toolbar__btn[aria-disabled="true"]{opacity:0.5;cursor:progress}
.composer-toolbar__btn svg{width:14px;height:14px;flex-shrink:0}
.composer-toolbar__spacer{flex:1}
.composer-toolbar__status{font-family:var(--font-mono);font-size:10px;color:var(--meta);letter-spacing:0.04em}
.input-bar__wrapper{display:flex;align-items:flex-end;gap:var(--space-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--space-3) var(--space-2) var(--space-2) var(--space-4);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);max-width:760px;margin:0 auto}
.input-bar__wrapper:focus-within{border-color:var(--accent);background:var(--surface-raised)}
.composer-toast{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2) var(--space-3);background:var(--surface);border-left:3px solid var(--foam);padding:var(--space-3) var(--space-4);font-size:13px;color:var(--fg-2);font-family:var(--font-body);line-height:1.5;border-radius:0 var(--r) var(--r) 0;margin-top:var(--space-2);max-width:760px;margin-left:auto;margin-right:auto}
.composer-toast[hidden]{display:none}
.composer-toast__btn{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;border:1px solid var(--foam);color:var(--foam);background:transparent;transition:all var(--dur) var(--ease)}
.composer-toast__btn:hover{background:rgba(156,207,216,0.12)}
.toast-in{animation:toastIn var(--dur-slow) var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.toast-in{animation:none}}
.input-bar__textarea{flex:1;min-width:0;resize:none;border:none;background:transparent;font-size:15px;font-family:var(--font-body);line-height:1.5;max-height:120px;min-height:22px;padding:6px 0;color:var(--fg)}
.input-bar__textarea::placeholder{color:var(--meta)}
.input-bar__actions{display:flex;align-items:center;gap:var(--space-1);flex-shrink:0}
.input-bar__send{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r);background:var(--accent);color:var(--bg);border:none;cursor:pointer;transition:opacity var(--dur) var(--ease),transform 120ms var(--ease)}
.input-bar__send:hover{opacity:0.85}
.input-bar__send:active{transform:scale(0.9)}
.input-bar__stop{display:none;place-items:center;width:32px;height:32px;border-radius:var(--r);background:var(--love);color:#fff;border:none;cursor:pointer;transition:opacity var(--dur) var(--ease),transform 120ms var(--ease)}
.input-bar__stop:hover{opacity:0.85}

.eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--meta);max-width:760px;width:100%;margin:0 auto;padding:var(--space-3) var(--space-4) 0;display:flex;align-items:center;gap:var(--space-3)}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--border)}
.results{max-width:760px;width:100%;margin:0 auto;padding:var(--space-3) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);overflow-y:auto;flex-shrink:1;min-height:0}
.results:empty{display:none}
.results__status{font-size:13px;color:var(--muted);padding:var(--space-2) var(--space-3);display:flex;align-items:center;gap:var(--space-2)}
.results__status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1400ms var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:0.35}50%{opacity:1}}
.results__error{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-left:2px solid var(--love);border-radius:var(--r);background:var(--surface);color:var(--fg);font-size:14px;line-height:1.55}
.results__error-title{font-family:var(--font-display);font-style:italic;font-size:16px;color:var(--love)}
.results__error-hint{color:var(--muted);font-size:13px}

.artifact-card{position:relative;background:var(--bg);border:1px solid var(--border);border-left-width:3px;border-left-style:solid;border-left-color:var(--accent);border-radius:var(--r);padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);animation:cardIn 280ms var(--ease)}
.artifact-card[data-kind="mermaid"],.artifact-card[data-kind="diagram"]{border-left-color:var(--foam)}
.artifact-card[data-kind="quiz"]{border-left-color:var(--gold)}
.artifact-card[data-kind="todo"]{border-left-color:var(--pine)}
.artifact-card[data-kind="chat"]{border-left-color:var(--accent)}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.artifact-card__header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.artifact-card__meta{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.artifact-card__kind{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--meta)}
.artifact-card__badge{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--overlay);color:var(--foam)}
.artifact-card__title{font-family:var(--font-display);font-style:italic;font-size:18px;font-weight:500;color:var(--fg);line-height:1.3;margin:0}
.artifact-card__sub{font-family:var(--font-mono);font-size:11px;color:var(--meta);letter-spacing:0.04em}
.artifact-card__body{color:var(--fg);font-size:14px;line-height:1.6}
.artifact-card__body p{margin:0 0 var(--space-2)}.artifact-card__body p:last-child{margin-bottom:0}
.artifact-card__body pre{background:var(--surface-sunken);border-radius:var(--r);padding:var(--space-3);overflow-x:auto;margin:var(--space-2) 0;font-family:var(--font-mono);font-size:12px}

.artifact-card__diagram{display:flex;flex-direction:column;align-items:stretch;gap:var(--space-2);background:var(--surface-sunken);border-radius:var(--r);padding:var(--space-4);overflow-x:auto}
.artifact-card__diagram svg{max-width:100%;height:auto}
.artifact-card__diagram-source{margin-top:var(--space-2)}
.artifact-card__diagram-source summary{font-family:var(--font-mono);font-size:11px;color:var(--meta);cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;list-style:none}
.artifact-card__diagram-source summary::-webkit-details-marker{display:none}
.artifact-card__diagram-source pre{margin:var(--space-2) 0 0;font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word}

.artifact-card__todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)}
.artifact-card__todo-item{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--r);background:var(--overlay);cursor:pointer;transition:background var(--dur) var(--ease)}
.artifact-card__todo-item:hover{background:var(--surface-warm)}
.artifact-card__todo-item input[type="checkbox"]{margin-top:3px;accent-color:var(--pine);cursor:pointer}
.artifact-card__todo-item-text{flex:1;font-size:14px;color:var(--fg)}
.artifact-card__todo-item input[type="checkbox"]:checked + .artifact-card__todo-item-text{color:var(--meta);text-decoration:line-through}

.artifact-card__quiz-question{font-family:var(--font-display);font-size:16px;font-weight:500;color:var(--fg);line-height:1.4;margin:var(--space-3) 0 var(--space-2)}
.artifact-card__quiz-question:first-child{margin-top:0}
.artifact-card__quiz-options{display:flex;flex-direction:column;gap:var(--space-2)}
.artifact-card__quiz-option{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--r);background:var(--overlay);cursor:pointer;font-size:14px;color:var(--fg);transition:all var(--dur) var(--ease),transform 120ms var(--ease)}
.artifact-card__quiz-option:hover{background:var(--surface-warm)}
.artifact-card__quiz-option:active{transform:scale(0.99)}
.artifact-card__quiz-option.is-selected{background:var(--accent-dim)}
.artifact-card__quiz-option.is-correct{background:rgba(156,207,216,0.10);outline:1px solid var(--foam)}
.artifact-card__quiz-option.is-incorrect{background:rgba(235,111,146,0.10);outline:1px solid var(--love)}
.artifact-card__quiz-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--meta);flex-shrink:0;margin-top:2px;transition:all var(--dur) var(--ease)}
.artifact-card__quiz-option.is-selected .artifact-card__quiz-radio{border-color:var(--accent);background:var(--accent)}
.artifact-card__quiz-option.is-correct .artifact-card__quiz-radio{border-color:var(--foam);background:var(--foam)}
.artifact-card__quiz-option.is-incorrect .artifact-card__quiz-radio{border-color:var(--love);background:var(--love)}
.artifact-card__quiz-explanation{margin:var(--space-2) 0 0;font-size:13px;color:var(--muted);line-height:1.5;font-style:italic}

.probe-wrap{display:flex;flex-direction:column;gap:var(--space-3);max-width:760px;width:100%;margin:0 auto;padding:var(--space-2) 0}
.probe-actions{display:flex;justify-content:flex-end}
.probe-send{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;padding:8px 16px;border-radius:var(--r);background:var(--accent);color:var(--bg);transition:opacity var(--dur) var(--ease)}
.probe-send:hover{opacity:0.85}
.probe-send:disabled{opacity:0.5;cursor:not-allowed}
.artifact-card.sent{opacity:0.5;pointer-events:none}
.artifact-card__marker{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--meta);flex-shrink:0}
.artifact-card__content{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.probe-wrap .artifact-card__quiz-question{margin:0}
.probe-wrap .artifact-card__quiz-qtext{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--fg);margin-bottom:var(--space-3);line-height:1.4}
.probe-wrap .artifact-card__quiz-qtext.typed{overflow:visible;white-space:normal;border-right-color:transparent;width:auto}
.probe-wrap .artifact-card__quiz-option{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--r);font-size:13px;cursor:pointer;background:var(--overlay);border:1px solid transparent;transition:all var(--dur) var(--ease);text-align:left;width:100%;font-family:inherit;color:inherit}
.probe-wrap .artifact-card__quiz-option:hover{background:var(--surface-warm)}
.probe-wrap .artifact-card__quiz-option.selected{border-color:var(--accent);background:var(--accent-dim)}
.probe-wrap .artifact-card__quiz-radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--meta);flex-shrink:0;transition:all var(--dur) var(--ease)}
.probe-wrap .artifact-card__quiz-option.selected .artifact-card__quiz-radio{border-color:var(--accent);background:var(--accent)}

.typing-indicator{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0}
.typing-indicator__bar{width:80px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:gradientSweep 1.2s ease infinite}
@keyframes gradientSweep{0%{background-position:200% 0}100%{background-position:-200% 0}}

@keyframes msgCascade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg{animation:msgCascade 700ms var(--ease) both}
.msg:nth-child(1){animation-delay:0ms}.msg:nth-child(2){animation-delay:250ms}.msg:nth-child(3){animation-delay:500ms}.msg:nth-child(4){animation-delay:750ms}.msg:nth-child(5){animation-delay:1000ms}
@keyframes hamburgerMorph1{to{transform:translateY(7px) rotate(45deg)}}
@keyframes hamburgerMorph2{to{opacity:0}}
@keyframes hamburgerMorph3{to{transform:translateY(-7px) rotate(-45deg)}}

.word{display:inline-block;opacity:0;transform:translateY(4px);animation:wordIn 350ms var(--ease) forwards}
@keyframes wordIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1023px){.sidebar{position:absolute;left:0;top:0;bottom:0;z-index:30;width:var(--sidebar-w);max-width:var(--sidebar-w);min-width:var(--sidebar-w)}.input-bar__wrapper{max-width:100%}.composer-toolbar{max-width:100%}.composer-toast{max-width:100%}}

<script>
const API = '/api';
let sessionId = null;
let streaming = false;
let streamCtrl = null;
let last_math_typeset = 0;
let pending_probe_reply = null;

const ARTIFACT_DEFAULTS = {
  mermaid: 'Summarize the key concepts visually as a diagram.',
  quiz: 'Generate a short practice quiz on the key concepts.',
  todo: 'Generate a focused study plan as a small checklist.'
};
const ARTIFACT_KIND_LABEL = { mermaid: 'diagram', quiz: 'quiz', todo: 'todo' };
const TOOL_STATUS = { web_search: 'searching the web…', generate_mermaid: 'generating mermaid…', generate_quiz: 'generating quiz…', generate_todo: 'generating todo list…', generate_study_plan: 'generating study plan…', record_step_actions: 'recording next steps…' };

function client_msg_id(){
  const web_crypto=globalThis.crypto;
  const uuid=globalThis.crypto?.randomUUID?.();
  if(uuid)return uuid;
  const bytes=new Uint8Array(16);
  if(web_crypto?.getRandomValues){
    try{web_crypto.getRandomValues(bytes)}catch(e){}
  }
  const now=Date.now();
  for(let i=0;i<bytes.length;i++)bytes[i]=((Math.random()*256)|0)^((now>>>((i%4)*8))&255);
  bytes[6]=(bytes[6]&15)|64;
  bytes[8]=(bytes[8]&63)|128;
  return [...bytes].map((byte,index)=>`${byte.toString(16).padStart(2,'0')}${[3,5,7,9].includes(index)?'-':''}`).join('').slice(0,36);
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

const box = document.getElementById('messages');
const input = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const composerStatus = document.getElementById('composer-status');

const sidebar=document.getElementById('sidebar');const backdrop=document.getElementById('sidebar-backdrop');const menu_btn=document.getElementById('menu-btn');const mobile_query=window.matchMedia('(max-width:1023px)');const reduced_motion=window.matchMedia('(prefers-reduced-motion: reduce)');
function reconcile_sidebar(){try{ if(!sidebar||!backdrop||!menu_btn) return; if(mobile_query.matches){sidebar.classList.add('collapsed');backdrop.classList.remove('open')}else{sidebar.classList.remove('collapsed');backdrop.classList.remove('open')}menu_btn.setAttribute('aria-expanded',String(!sidebar.classList.contains('collapsed')))}catch(e){}}
function close_sidebar(){try{ sidebar?.classList.add('collapsed');backdrop?.classList.remove('open');menu_btn?.setAttribute('aria-expanded','false')}catch(e){}}
function toggleSidebar(){try{ const open=sidebar.classList.toggle('collapsed')===false;if(mobile_query.matches)backdrop.classList.toggle('open',open);menu_btn.setAttribute('aria-expanded',String(open))}catch(e){}}
try{ reconcile_sidebar(); }catch(e){}
mobile_query.addEventListener('change', reconcile_sidebar);window.addEventListener('resize', reconcile_sidebar);
document.getElementById('menu-btn')?.addEventListener('click', toggleSidebar);backdrop?.addEventListener('click', close_sidebar);document.addEventListener('keydown',e=>{if(e.key==='Escape')close_sidebar()});
document.querySelectorAll('.sidebar__header').forEach(b=> b.addEventListener('click',()=>{ const sec=b.closest('.sidebar__section'); if(!sec) return; const open=sec.classList.toggle('open');b.setAttribute('aria-expanded',String(open))}));

function renderMd(t){return marked.parse(t,{breaks:true,gfm:true})}
function sanitize_html(html){
  const template=document.createElement('template');
  template.innerHTML=html;
  const allowed_tags=new Set(['A','ABBR','B','BLOCKQUOTE','BR','CODE','DEL','EM','H1','H2','H3','H4','H5','H6','HR','I','IMG','KBD','LI','OL','P','PRE','S','STRONG','SUB','SUP','TABLE','TBODY','TD','TFOOT','TH','THEAD','TR','UL']);
  const nodes=[...template.content.querySelectorAll('*')];
  nodes.forEach(node=>{
    if(!allowed_tags.has(node.tagName)){node.replaceWith(document.createTextNode(node.textContent||''));return}
    [...node.attributes].forEach(attribute=>{
      const name=attribute.name.toLowerCase();
      const value=attribute.value.trim().toLowerCase();
      const allowed_attribute=name==='alt'||name==='class'||name==='height'||name==='href'||name==='rel'||name==='target'||name==='title'||name==='width'||name==='src';
      if(!allowed_attribute||name.startsWith('on')||name==='style'||((name==='href'||name==='src')&&(value.startsWith('javascript:')||value.startsWith('data:'))))node.removeAttribute(attribute.name);
    });
  });
  return template.innerHTML;
}
function render_math(force){
  if(!(window.MathJax&&MathJax.typesetPromise))return;
  const now=Date.now();
  if(!force&&now-last_math_typeset<400)return;
  last_math_typeset=now;
  MathJax.typesetPromise([box]).catch(()=>{});
}
function wrapWords(container){
  try{
    if(!container||reduced_motion.matches)return;
    if(container.dataset.wordWrapped==='1')return;
    let word_idx=0;
    function walk(node){
      try{
        if(node.nodeType===1){
          const tag=node.tagName;
          if(tag==='PRE'||tag==='CODE'||tag==='SCRIPT'||tag==='STYLE')return;
          if(node.classList&&node.classList.contains('word'))return;
          const children=Array.from(node.childNodes);
          children.forEach(walk);
        }else if(node.nodeType===3){
          const text=node.textContent;
          if(!text||!text.trim())return;
          if(text.includes('$')||text.includes('\\(')||text.includes('\\['))return;
          const parent=node.parentElement;
          if(parent&&parent.closest&&parent.closest('pre,code'))return;
          const tokens=text.split(/(\s+)/);
          if(tokens.length===1&&tokens[0]==='')return;
          const frag=document.createDocumentFragment();
          tokens.forEach(tok=>{
            if(tok==='')return;
            if(/^\s+$/.test(tok)){
              frag.appendChild(document.createTextNode(tok));
            }else{
              const span=document.createElement('span');
              span.className='word';
              span.textContent=tok;
              span.style.animationDelay=Math.min(word_idx*32,2000)+'ms';
              word_idx++;
              frag.appendChild(span);
            }
          });
          if(frag.childNodes.length)node.replaceWith(frag);
        }
      }catch(e){}
    }
    walk(container);
    container.dataset.wordWrapped='1';
    const words=container.querySelectorAll('.word');
    if(words.length){
      const max_delay=Math.min((words.length-1)*32,2000)+400;
      setTimeout(()=>{
        words.forEach(w=>{
          if(getComputedStyle(w).opacity==='0'){
            w.style.opacity='1';
            w.style.transform='none';
          }
        });
      },max_delay+50);
    }
  }catch(e){}
}
function animateWords(element){try{wrapWords(element)}catch(e){}}
function wrapQuizWords(card){
  try{
    if(!card||reduced_motion.matches)return;
    card.querySelectorAll('.artifact-card__quiz-qtext,.artifact-card__quiz-question').forEach(qtext=>{
      if(qtext.dataset.wordWrapped==='1')return;
      if(qtext.querySelector('.word'))return;
      wrapWords(qtext);
    });
  }catch(e){}
}

function addMessage(role,content){
  const d=document.createElement('div');
  d.className=`msg msg--${role}`;
  d.innerHTML=`<div class="msg__role">${role==='user'?'You':'Sage'}</div><div class="msg__bubble">${role==='assistant'?sanitize_html(renderMd(content)):esc(content)}</div>`;
  box.appendChild(d);
  if(role==='assistant'){render_math(true);const bubble=d.querySelector('.msg__bubble');if(bubble)wrapWords(bubble);}
  box.scrollTop=box.scrollHeight;
  return d;
}

function addTypingIndicator(){
  removeTypingIndicator();
  const d=document.createElement('div');
  d.className='msg msg--assistant';
  d.id='typing-indicator';
  d.innerHTML='<div class="msg__role">Sage</div><div class="msg__bubble"><div class="typing-indicator"><div class="typing-indicator__bar"></div></div></div>';
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}
function removeTypingIndicator(){const el=document.getElementById('typing-indicator');if(el)el.remove()}

function addStreamingMessage(){
  const d=document.createElement('div');
  d.className='msg msg--assistant';
  d.id='streaming-msg';
  d.innerHTML='<div class="msg__role">Sage</div><div class="msg__bubble" id="streaming-bubble"></div>';
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return document.getElementById('streaming-bubble');
}

function set_composer_status(message){composerStatus.textContent=message}

function tool_status_text(ev){
  const name=String(ev.tool||ev.name||'').toLowerCase();
  if(TOOL_STATUS[name])return TOOL_STATUS[name];
  return name?`running ${name.replace(/_/g,' ')}…`:'working…';
}

function label_for_chunk(chunk_id,chunks){
  const match=(chunks||[]).find(c=>c&&(c.id===chunk_id||c.chunk_id===chunk_id));
  if(!match)return `chunk ${String(chunk_id??'').slice(0,8)}`;
  const label=match.display_name||match.title||match.file_name||match.document||match.source||(typeof match.file==='string'?match.file:null);
  return label||`chunk ${String(chunk_id??'').slice(0,8)}`;
}

function append_chips_row(message_el){
  const row=document.createElement('div');
  row.className='cite-row';
  message_el.appendChild(row);
  return row;
}

function append_citation_chips(message_el,ids,chunks){
  if(!message_el||!ids.length)return;
  const row=append_chips_row(message_el);
  ids.forEach(id=>{
    const chip=document.createElement('span');
    chip.className='cite';
    chip.textContent=label_for_chunk(id,chunks);
    row.appendChild(chip);
  });
}

function append_web_source_chips(message_el,sources){
  if(!message_el||!(sources||[]).length)return;
  const row=append_chips_row(message_el);
  sources.forEach(s=>{
    if(!s||!s.url)return;
    const a=document.createElement('a');
    a.className='cite';
    a.href=s.url;
    a.target='_blank';
    a.rel='noopener';
    a.textContent=s.title||s.url;
    row.appendChild(a);
  });
  if(!row.children.length)row.remove();
}

function append_action_chips(message_el,actions){
  if(!message_el||!(actions||[]).length)return;
  const row=append_chips_row(message_el);
  actions.forEach(action=>{
    if(!action)return;
    const btn=document.createElement('button');
    btn.className='cite';
    btn.type='button';
    const label=action.label||action.id||'continue';
    btn.textContent=label;
    btn.setAttribute('aria-label',String(label));
    const action_id=String(action.id||'').toLowerCase();
    btn.onclick=()=>{
      if(action_id.includes('ask_question')){input.focus();return}
      if(action.prompt){input.value=action.prompt;sendMessage()}
    };
    row.appendChild(btn);
  });
  if(!row.children.length)row.remove();
}

function show_card(card){setTimeout(()=>{card.classList.add('visible');wrapQuizWords(card);},60)}

function build_probe_card(question, ordinal, marker_text, on_select) {
  const card = document.createElement('article');
  card.className = 'artifact-card';
  card.dataset.kind = 'quiz';
  card.dataset.ordinal = String(ordinal);
  card.dataset.selected = '';
  card.setAttribute('aria-label', `Question ${ordinal}`);
  const marker = document.createElement('span');
  marker.className = 'artifact-card__marker';
  marker.textContent = marker_text;
  const title = document.createElement('h3');
  title.className = 'artifact-card__title';
  title.textContent = `Question ${ordinal}`;
  const header = document.createElement('header');
  header.className = 'artifact-card__header';
  header.appendChild(marker);
  header.appendChild(title);
  const content = document.createElement('div');
  content.className = 'artifact-card__content';
  const wrap = document.createElement('div');
  wrap.className = 'artifact-card__quiz-question';
  const qtext = document.createElement('div');
  qtext.className = 'artifact-card__quiz-qtext';
  qtext.textContent = String(question.question || '');
  qtext.addEventListener('animationend', () => qtext.classList.add('typed'), { once: true });
  const options_el = document.createElement('div');
  options_el.className = 'artifact-card__quiz-options';
  options_el.setAttribute('role', 'radiogroup');
  options_el.setAttribute('aria-label', `Question ${ordinal}`);
  const option_buttons = [];
  (Array.isArray(question.options) ? question.options : []).forEach((opt, oi) => {
    const opt_btn = document.createElement('button');
    opt_btn.type = 'button';
    opt_btn.className = 'artifact-card__quiz-option';
    opt_btn.setAttribute('role', 'radio');
    opt_btn.setAttribute('aria-checked', 'false');
    const radio = document.createElement('span');
    radio.className = 'artifact-card__quiz-radio';
    radio.setAttribute('aria-hidden', 'true');
    const label = document.createElement('span');
    label.textContent = `${String.fromCharCode(65 + oi)}) ${opt}`;
    opt_btn.appendChild(radio);
    opt_btn.appendChild(label);
    opt_btn.onclick = () => {
      card.dataset.selected = String(oi);
      option_buttons.forEach((btn, idx) => {
        btn.classList.toggle('selected', idx === oi);
        btn.setAttribute('aria-checked', String(idx === oi));
      });
      on_select();
    };
    option_buttons.push(opt_btn);
    options_el.appendChild(opt_btn);
  });
  wrap.appendChild(qtext);
  wrap.appendChild(options_el);
  content.appendChild(wrap);
  card.appendChild(header);
  card.appendChild(content);
  return card;
}

function start_probe_batch(items, kind_label) {
  if (!Array.isArray(items) || !items.length) return;
  const entries = [];
  let send_btn = null;
  const submit = () => {
    if (!send_btn || send_btn.disabled) return;
    const parts = [];
    entries.forEach(entry => {
      const sel = entry.card.dataset.selected;
      if (sel === '') return;
      parts.push(`${entry.card.dataset.ordinal}: ${String.fromCharCode(65 + Number(sel))}`);
    });
    if (!parts.length) return;
    entries.forEach(entry => entry.card.classList.add('sent'));
    send_btn.disabled = true;
    queue_probe_reply(parts.join('; '));
  };
  const update_state = () => {
    if (!send_btn) return;
    const open = entries.filter(entry => !entry.card.classList.contains('sent'));
    const answered = open.filter(entry => entry.card.dataset.selected !== '');
    send_btn.disabled = answered.length === 0;
    if (open.length > 0 && answered.length === open.length) submit();
  };
  const wrap = document.createElement('div');
  wrap.className = 'probe-wrap';
  items.forEach((question, qi) => {
    const marker_text = kind_label === 'check'
      ? 'CHECK'
      : `PROBE \u00b7 ${String(qi + 1).padStart(2, '0')}`;
    const card = build_probe_card(question, qi + 1, marker_text, update_state);
    entries.push({ card });
    wrap.appendChild(card);
  });
  const actions = document.createElement('div');
  actions.className = 'probe-actions';
  send_btn = document.createElement('button');
  send_btn.type = 'button';
  send_btn.className = 'probe-send';
  send_btn.textContent = 'Send answers';
  send_btn.disabled = true;
  send_btn.onclick = submit;
  actions.appendChild(send_btn);
  wrap.appendChild(actions);
  const anchor = document.getElementById('streaming-msg') || box.lastElementChild;
  if (anchor && anchor.parentElement === box) anchor.after(wrap);
  else box.appendChild(wrap);
  entries.forEach(entry => show_card(entry.card));
  box.scrollTop = box.scrollHeight;
}

function queue_probe_reply(text) {
  if (streaming) { pending_probe_reply = text; return; }
  input.value = text;
  sendMessage();
}

async function sendMessage(){
  const text=input.value.trim();
  if(!text||streaming)return;
  input.value='';
  input.style.height='auto';

  const hero=document.querySelector('.hero');
  if(hero)hero.remove();

  addMessage('user',text);
  addTypingIndicator();
  let fullText='';
  let was_aborted=false;
  let done_error_message=null;
  let done_actions=[];
  let done_web_sources=[];
  let meta_chunks=[];
  let citation_ids=[];
  streaming=true;
  sendBtn.style.display='none';
  if(stopBtn)stopBtn.style.display='grid';

  if(!sessionId){
    try{
      const sr=await fetch(`${API}/sessions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:text,grounding_mode:'grounded'})});
      if(!sr.ok)throw new Error(`Session creation failed: ${sr.status}`);
      const sd=await sr.json();
      sessionId=sd.id||sd.session?.id;
      if(!sessionId)throw new Error('Session creation returned no session id');
      loadSessionsList();
    }catch(e){
      streaming=false;
      streamCtrl=null;
      sendBtn.style.display='';
      if(stopBtn)stopBtn.style.display='none';
      removeTypingIndicator();
      addMessage('assistant',esc(`Could not create a session. ${e instanceof Error?e.message:'Please try again.'}`));
      return;
    }
  }

  const ctrl=new AbortController();
  streamCtrl=ctrl;
  let bubble=null;
  let bubble_started=false;
  let streamDone=false;

  try{
    const res=await fetch(`${API}/sessions/${sessionId}/turns`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,client_msg_id:client_msg_id()}),signal:ctrl.signal});
    if(!res.ok)throw new Error(`Stream failed: ${res.status}`);
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    const consume_line=line=>{
      if(!line.startsWith('data:'))return;
      try{
        const ev=JSON.parse(line.slice(5).trim());
        if(ev.type==='delta'){
          if(!bubble_started){removeTypingIndicator();bubble=addStreamingMessage();bubble_started=true}
          fullText+=ev.delta||'';
          bubble.innerHTML=sanitize_html(renderMd(fullText));
          render_math(false);
          box.scrollTop=box.scrollHeight;
        }else if(ev.type==='meta'){
          meta_chunks=Array.isArray(ev.chunks)?ev.chunks:[];
          if(bubble)bubble.dataset.sources=String(meta_chunks.length);
        }else if(ev.type==='citation'){
          const cid=ev.chunk_id!==undefined?ev.chunk_id:ev.id;
          if(cid!==undefined&&cid!==null&&!citation_ids.some(existing=>existing===cid))citation_ids.push(cid);
        }else if(ev.type==='tool_call'){
          set_composer_status(tool_status_text(ev));
        }else if(ev.type==='tool_result'){
          set_composer_status('');
          if(ev.name==='run_probe'&&Array.isArray(ev.questions)&&ev.questions.length){
            start_probe_batch(ev.questions,'probe');
          }else if(ev.name==='advance_lesson'&&ev.check_question&&ev.check_question.question){
            start_probe_batch([ev.check_question],'check');
          }
        }else if(ev.type==='done'){
          streamDone=true;
          if(Array.isArray(ev.actions))done_actions=ev.actions;
          if(Array.isArray(ev.web_sources))done_web_sources=ev.web_sources;
        }else if(ev.type==='error'){
          streamDone=true;
          done_error_message=ev.message||'Generation failed';
        }
      }catch(_){}
    };
    while(!streamDone){
      const{done,value}=await reader.read();
      if(done){buf+=dec.decode();break}
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      lines.forEach(consume_line)
    }
    if(buf.trim())consume_line(buf)
  }catch(e){
    was_aborted=e.name==='AbortError';
    if(!was_aborted){removeTypingIndicator();bubble=bubble_started?bubble:addStreamingMessage();bubble.innerHTML='<div style="color:var(--love)">Connection error</div>'}
  }

  streaming=false;
  streamCtrl=null;
  sendBtn.style.display='';
  if(stopBtn)stopBtn.style.display='none';
  set_composer_status('');
  removeTypingIndicator();
  const streamingEl=document.getElementById('streaming-msg');
  if(streamingEl)streamingEl.remove();
  let assistant_msg=null;
  if(fullText){
    assistant_msg=addMessage('assistant',fullText);
  }else if(was_aborted){
  }else if(done_error_message){
    assistant_msg=addMessage('assistant',esc(`Error: ${done_error_message}`));
  }else{
    assistant_msg=addMessage('assistant','Sage could not produce a response. Please try again.');
  }
  if(assistant_msg){
    append_citation_chips(assistant_msg,citation_ids,meta_chunks);
    append_web_source_chips(assistant_msg,done_web_sources);
    append_action_chips(assistant_msg,done_actions);
    render_math(true);
  }
  if(pending_probe_reply){
    const reply=pending_probe_reply;
    pending_probe_reply=null;
    queue_probe_reply(reply);
  }
  if(sessionId){try{await fetch(`${API}/sessions/${sessionId}/title`,{method:'POST'});await loadSessionsList()}catch(e){}}
}

function ensureSession(goal){
  if(sessionId)return Promise.resolve(sessionId);
  return fetch(`${API}/sessions`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({goal:goal,grounding_mode:'grounded'})
  }).then(async res=>{
    if(!res.ok){
      const err = new Error(`Session creation failed: ${res.status}`);
      err.status = res.status;
      try{ err.body = await res.json(); }catch(_){}
      throw err;
    }
    const data = await res.json();
    sessionId = data.id || (data.session && data.session.id);
    if(!sessionId){
      const e = new Error('Session creation returned no session id');
      e.status = 500;
      throw e;
    }
    loadSessionsList();
    sync_nav_workspace();
    return sessionId;
  });
}

function generateArtifact({sid, prompt, kind, count}){
  return fetch(`${API}/sessions/${sid}/outputs`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({output_kind:kind, prompt:prompt, count:count || 3})
  }).then(async res=>{
    if(!res.ok){
      const err = new Error(`Artifact generation failed: ${res.status}`);
      err.status = res.status;
      try{ err.body = await res.json(); }catch(_){}
      throw err;
    }
    return res.json();
  });
}

function artifact_error_message(status, body){
  const codes = ((body && body.error && body.error.detail && body.error.detail.issue_codes) || (body && body.detail && body.detail.issue_codes) || []);
  if(codes.indexOf('mermaid_validator_unavailable') !== -1){
    return {
      title: 'Mermaid validator is unavailable',
      hint: 'The diagram adapter could not run on this host, so the diagram could not be validated. Quiz and Todo still work — try the other buttons. To enable diagrams, provision the Mermaid adapter under node_modules and reload.'
    };
  }
  if(codes.indexOf('mermaid_invalid') !== -1){
    return {
      title: 'Could not draw the diagram',
      hint: 'Sage produced a Mermaid source that failed syntax validation. Try rephrasing the prompt with simpler concepts, or use Todo or Quiz instead.'
    };
  }
  if(codes.indexOf('insufficient_context') !== -1){
    return {
      title: 'No source material to ground on',
      hint: 'This session is in strict grounding mode and has no uploaded material. Switch the session to grounded mode, upload a file, or try a different prompt.'
    };
  }
  if(status === 401 || status === 403){
    return { title: 'Model endpoint not authorized', hint: 'The local model endpoint rejected the request. Check the API key in .env.' };
  }
  if(status >= 500){
    return { title: 'Sage could not reach the model', hint: 'The model endpoint returned a server error. Try again in a moment.' };
  }
  return { title: 'Could not generate this artifact', hint: (body && body.error && body.error.message) || 'Try a different prompt or another artifact kind.' };
}

  title.className = 'results__error-title';

  hint.className = 'results__error-hint';

function clearResultsErrors(){

function mermaid_init_once(){
  if(mermaidReady || !window.mermaid || !window.mermaid.initialize)return;
  window.mermaid.initialize({
    startOnLoad:false,
    securityLevel:'strict',
    theme:'dark',
    themeVariables:{
      primaryColor:'#383835',
      primaryTextColor:'#f0efe8',
      primaryBorderColor:'#c4a7e7',
      lineColor:'#7a7872',
      secondaryColor:'#2f2f2c',
      tertiaryColor:'#1a1a19',
      fontFamily:"'Newsreader', Georgia, serif"
    }
  });
  mermaidReady = true;
}

function buildArtifactHeader(envelope, index){
  const kind = envelope.kind;
  const kindLabel = (kind === 'mermaid') ? 'diagram' : kind;
  const counter = String(index).padStart(2,'0');
  const header = document.createElement('header');
  header.className = 'artifact-card__header';
  const meta = document.createElement('div');
  meta.className = 'artifact-card__meta';
  const kindEl = document.createElement('span');
  kindEl.className = 'artifact-card__kind';
  kindEl.textContent = `artifact · ${counter} · ${kindLabel}`;
  const badge = document.createElement('span');
  badge.className = 'artifact-card__badge';
  badge.textContent = envelope.validation && envelope.validation.status === 'validated' ? 'validated' : 'rendered';
  meta.appendChild(kindEl);
  meta.appendChild(badge);
  header.appendChild(meta);
  if(envelope.citations && envelope.citations.length){
    const sub = document.createElement('span');
    sub.className = 'artifact-card__sub';
    sub.textContent = `${envelope.citations.length} citation${envelope.citations.length === 1 ? '' : 's'}`;
    header.appendChild(sub);
  }
  return header;
}

function buildArtifactTitle(text, sub){
  const wrap = document.createElement('div');
  const title = document.createElement('h3');
  title.className = 'artifact-card__title';
  title.textContent = text;
  wrap.appendChild(title);
  if(sub){
    const s = document.createElement('div');
    s.className = 'artifact-card__sub';
    s.textContent = sub;
    wrap.appendChild(s);
  }
  return wrap;
}

function renderArtifactDiagram(envelope){
  const body = document.createElement('div');
  body.className = 'artifact-card__body';
  const wrap = document.createElement('div');
  wrap.className = 'artifact-card__diagram';
  const node = document.createElement('div');
  node.className = 'mermaid';
  node.textContent = envelope.content.source;
  wrap.appendChild(node);
  body.appendChild(wrap);
  if(envelope.content.diagram_type){
    const t = document.createElement('div');
    t.className = 'artifact-card__sub';
    t.textContent = `type · ${envelope.content.diagram_type}`;
    body.appendChild(t);
  }
  const source = document.createElement('details');
  source.className = 'artifact-card__diagram-source';
  const summary = document.createElement('summary');
  summary.textContent = 'source';
  source.appendChild(summary);
  const pre = document.createElement('pre');
  pre.textContent = envelope.content.source;
  source.appendChild(pre);
  body.appendChild(source);
  mermaid_init_once();
  if(window.mermaid && window.mermaid.run){
    window.mermaid.run({nodes:[node], securityLevel:'strict'}).catch(err=>{
      const fb = document.createElement('div');
      fb.className = 'artifact-card__sub';
      fb.textContent = `diagram could not render: ${err && err.message ? err.message : 'unknown error'}`;
      body.insertBefore(fb, source);
    });
  }else{
    const fb = document.createElement('div');
    fb.className = 'artifact-card__sub';
    fb.textContent = 'Diagrams are unavailable while the renderer is offline. The source above still shows the definition.';
    body.insertBefore(fb, source);
  }
  return body;
}

function renderArtifactTodo(envelope){
  const body = document.createElement('div');
  body.className = 'artifact-card__body';
  const list = document.createElement('ul');
  list.className = 'artifact-card__todo-list';
  envelope.content.items.forEach(item=>{
    const li = document.createElement('li');
    li.className = 'artifact-card__todo-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!item.done;
    cb.setAttribute('aria-label', `mark "${item.text}" as ${cb.checked ? 'incomplete' : 'complete'}`);
    const text = document.createElement('span');
    text.className = 'artifact-card__todo-item-text';
    text.textContent = item.text;
    li.appendChild(cb);
    li.appendChild(text);
    cb.addEventListener('change',()=>{
      cb.setAttribute('aria-label', `mark "${item.text}" as ${cb.checked ? 'incomplete' : 'complete'}`);
    });
    list.appendChild(li);
  });
  body.appendChild(list);
  return body;
}

function renderArtifactQuiz(envelope){
  const body = document.createElement('div');
  body.className = 'artifact-card__body';
  envelope.content.questions.forEach((q, idx)=>{
    const block = document.createElement('div');
    block.dataset.qid = q.id || String(idx);
    const qt = document.createElement('div');
    qt.className = 'artifact-card__quiz-question';
    qt.textContent = `${idx + 1}. ${q.question}`;
    block.appendChild(qt);
    const opts = document.createElement('div');
    opts.className = 'artifact-card__quiz-options';
    opts.setAttribute('role','radiogroup');
    opts.setAttribute('aria-label', `question ${idx + 1}`);
    q.options.forEach((opt, oi)=>{
      const label = document.createElement('label');
      label.className = 'artifact-card__quiz-option';
      label.setAttribute('role','radio');
      label.setAttribute('tabindex','0');
      label.dataset.index = String(oi);
      label.dataset.correct = String(q.correct_index);
      const radio = document.createElement('span');
      radio.className = 'artifact-card__quiz-radio';
      radio.setAttribute('aria-hidden','true');
      const text = document.createElement('span');
      text.textContent = opt;
      label.appendChild(radio);
      label.appendChild(text);
      opts.appendChild(label);
    });
    block.appendChild(opts);
    const reveal = (chosen)=>{
      [...opts.children].forEach((opt, oi)=>{
        opt.classList.remove('is-selected');
        opt.removeAttribute('tabindex');
        opt.setAttribute('aria-checked','false');
        if(oi === q.correct_index) opt.classList.add('is-correct');
        if(oi === chosen && oi !== q.correct_index) opt.classList.add('is-incorrect');
      });
      const sel = opts.children[chosen];
      if(sel){
        sel.classList.add('is-selected');
        sel.setAttribute('aria-checked','true');
      }
      if(!document.getElementById(`ex-${block.dataset.qid}`) && q.explanation){
        const ex = document.createElement('div');
        ex.className = 'artifact-card__quiz-explanation';
        ex.id = `ex-${block.dataset.qid}`;
        ex.textContent = q.explanation;
        block.appendChild(ex);
      }
    };
    [...opts.children].forEach((opt, oi)=>{
      const choose = ()=>{
        [...opts.children].forEach(o=>{o.classList.remove('is-selected');o.setAttribute('aria-checked','false');});
        opt.classList.add('is-selected');
        opt.setAttribute('aria-checked','true');
      };
      opt.addEventListener('click',()=>choose());
      opt.addEventListener('keydown',e=>{
        if(e.key === 'Enter' || e.key === ' '){e.preventDefault();choose();}
      });
      opt.addEventListener('dblclick',()=>reveal(oi));
    });
    opts.addEventListener('dblclick',()=>reveal(parseInt(opts.lastClickedIndex || '0',10)));
    opts.addEventListener('click',e=>{
      const opt = e.target.closest('.artifact-card__quiz-option');
      if(opt) opts.lastClickedIndex = opt.dataset.index;
    });
    body.appendChild(block);
  });
  return body;
}

function renderArtifactChat(envelope){
  const body = document.createElement('div');
  body.className = 'artifact-card__body';
  const p = document.createElement('p');
  p.textContent = envelope.content.content;
  body.appendChild(p);
  return body;
}

function renderArtifact(envelope){
  artifactCounter += 1;
  const index = artifactCounter;
  const card = document.createElement('article');
  card.className = 'artifact-card';
  card.dataset.kind = envelope.kind;
  card.setAttribute('aria-label', `${ARTIFACT_KIND_LABEL[envelope.kind] || envelope.kind} artifact`);
  card.appendChild(buildArtifactHeader(envelope, index));
  const titleText = envelope.content && (envelope.content.title || (envelope.kind === 'chat' ? 'Sage' : ''));
  if(titleText){
    const sub = envelope.kind === 'mermaid' && envelope.content.diagram_type ? envelope.content.diagram_type : null;
    card.appendChild(buildArtifactTitle(titleText, sub));
  }
  let body;
  if(envelope.kind === 'mermaid') body = renderArtifactDiagram(envelope);
  else if(envelope.kind === 'todo') body = renderArtifactTodo(envelope);
  else if(envelope.kind === 'quiz') body = renderArtifactQuiz(envelope);
  else body = renderArtifactChat(envelope);
  card.appendChild(body);
  return card;
}

function setArtifactButtonsDisabled(disabled){
  artifactBtns.forEach(b=>{b.setAttribute('aria-disabled', disabled ? 'true' : 'false');});
}

function maybeRedirectToWorkspace(sid){
  if(firstArtifactShown)return;
  firstArtifactShown = true;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = reduce ? 0 : 600;
  setTimeout(()=>{
    window.location.assign(`sage-workspace.html?session=${encodeURIComponent(sid)}`);
  }, wait);
}

function handleArtifactClick(kind){
  if(firstArtifactShown)return;
  const promptText = (input.value || '').trim();
  const prompt = promptText || ARTIFACT_DEFAULTS[kind];
  if(input) input.value = '';
  if(input) input.style.height = 'auto';
  clearResultsErrors();
  setArtifactButtonsDisabled(true);
  showResultsStatus(`Generating ${ARTIFACT_KIND_LABEL[kind]}…`);
  resultsEyebrow.hidden = false;
  Promise.resolve()
    .then(()=>ensureSession(prompt))
    .then(sid=>generateArtifact({sid, prompt, kind, count: kind === 'quiz' ? 3 : 3}))
    .then(envelope=>{
      showResultsStatus(null);
      const card = renderArtifact(envelope);
      resultsEl.appendChild(card);
      if(envelope.kind==='quiz')setTimeout(()=>wrapQuizWords(card),60);
      resultsEl.scrollTop = resultsEl.scrollHeight;
      maybeRedirectToWorkspace(sessionId);
    })
    .catch(err=>{
      showResultsStatus(null);
      const message = artifact_error_message(err.status || 0, err.body);
      showResultsError(message);
    })
    .finally(()=>setArtifactButtonsDisabled(false));
}

artifactBtns.forEach(btn=>{
  btn.addEventListener('click',()=>{
    const kind = btn.dataset.artifactKind;
    if(kind) handleArtifactClick(kind);
  });
});

(function index_attach_fix(){
  try{
    const file_input = document.getElementById('file-input');
    const attach_btn = document.getElementById('attach-btn');
    const status_el = document.getElementById('composer-status');
    const composer_toast = document.getElementById('composer-toast');
    const input_bar = document.querySelector('.input-bar__wrapper');
    function set_status(t){ if(status_el) status_el.textContent = t || 'Ask Sage anything...'; }
    let toast_timer = null;
    function hide_link_toast(){ clearTimeout(toast_timer); if(composer_toast) composer_toast.hidden = true; }
    function show_link_toast(count){
      if(!composer_toast || !count) return;
      clearTimeout(toast_timer);
      composer_toast.textContent = '';
      const label = document.createElement('span');
      label.textContent = `\u2713 ${count} ${count === 1 ? 'file' : 'files'} linked to this session.`;
      const strict_btn = document.createElement('button');
      strict_btn.type = 'button';
      strict_btn.className = 'composer-toast__btn';
      strict_btn.textContent = 'Strict mode \u2014 answer only from these';
      strict_btn.addEventListener('click', enable_strict_mode);
      composer_toast.append(label, strict_btn);
      composer_toast.hidden = false;
      if(!reduced_motion.matches){
        composer_toast.classList.remove('toast-in');
        void composer_toast.offsetWidth;
        composer_toast.classList.add('toast-in');
      }
      toast_timer = setTimeout(hide_link_toast, 8000);
    }
    async function enable_strict_mode(){
      if(!sessionId){
        set_status('Create a session first.');
        setTimeout(()=> set_status(''),3000);
        return;
      }
      try{
        const r = await fetch(`${API}/sessions/${encodeURIComponent(sessionId)}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({grounding_mode:'strict'})});
        if(!r.ok) throw new Error(`Failed to switch to strict mode: ${r.status}`);
        hide_link_toast();
        set_status('strict grounding on');
        setTimeout(()=> set_status(''),2000);
      }catch(e){
        set_status(e.message || 'Could not switch to strict mode.');
        setTimeout(()=> set_status(''),3000);
      }
    }
    async function ensure_session_for_files(names){
      if(sessionId) return sessionId;
      const goal = (names || []).filter(Boolean).slice(0, 3).join(', ') || 'uploaded files';
      const r = await fetch(`${API}/sessions`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({goal: `Study these files: ${goal}`.slice(0, 2000), grounding_mode:'grounded'})});
      if(!r.ok) throw new Error(`Session creation failed: ${r.status}`);
      const d = await r.json();
      sessionId = d.id || (d.session && d.session.id);
      if(!sessionId) throw new Error('Session creation returned no session id');
      return sessionId;
    }
    async function link_files_to_session(uploaded){
      const records = Array.isArray(uploaded) ? uploaded : [];
      const ids = records.map(f => f && f.id).filter(Boolean);
      if(!ids.length) return;
      try{
        await ensure_session_for_files(records.map(f => f.display_name));
        const r = await fetch(`${API}/sessions/${encodeURIComponent(sessionId)}/files`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({file_ids: ids})});
        if(!r.ok){
          const err = await r.json().catch(()=>({}));
          throw new Error(err.detail || `Linking failed: ${r.status}`);
        }
        show_link_toast(ids.length);
      }catch(e){
        set_status(e.message || 'Could not link files to session.');
        setTimeout(()=> set_status(''),3000);
      }
    }
    async function handle_files(files){
      if(!files || !files.length) return;
      const fd = new FormData();
      for(const f of files) fd.append('files', f);
      try{
        set_status('uploading…');
        const r = await fetch(`${API}/files`, {method:'POST', body: fd});
        if(!r.ok){
          const err = await r.json().catch(()=>({}));
          throw new Error(err.detail||`Upload failed: ${r.status}`);
        }
        const uploaded = await r.json();
        set_status('upload complete');
        await link_files_to_session(uploaded);
        try{ await loadSessionsList(); }catch(e){}
        setTimeout(()=> set_status(''),1500);
      }catch(e){
        set_status(e.message||'Upload failed');
        setTimeout(()=> set_status(''),3000);
      }
    }
    attach_btn?.addEventListener('click', ()=> file_input?.click());
    file_input?.addEventListener('change', e=>{
      const files = e.target.files;
      if(files && files.length) handle_files(files);
      e.target.value='';
    });
    input_bar?.addEventListener('dragover', e=>{ e.preventDefault(); input_bar.style.borderColor='var(--accent)';});
    input_bar?.addEventListener('dragleave', ()=>{ input_bar.style.borderColor='';});
    input_bar?.addEventListener('drop', e=>{
      e.preventDefault();
      input_bar.style.borderColor='';
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handle_files(e.dataTransfer.files);
    });
    const menu = document.getElementById('menu-btn');
    const sidebar_el = document.getElementById('sidebar');
    const backdrop_el = document.getElementById('sidebar-backdrop');
    [menu, sidebar_el, backdrop_el].forEach(el=>{
      if(el && !el.hasAttribute('aria-label') && el.id==='menu-btn') el.setAttribute('aria-label','Menu');
    });
  }catch(e){ console.error('index attach fix', e); }
})();

function sync_nav_workspace(){
  const link = document.querySelector('#nav-list a[href="sage-workspace.html"]');
  if(link && sessionId) link.href = `sage-workspace.html?session=${encodeURIComponent(sessionId)}`;
}
sync_nav_workspace();
</script>
</body>
</html>
